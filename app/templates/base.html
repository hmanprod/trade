<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Relay — {% block title %}Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body>
    {% if request.cookies.get("trade_session") %}
    <header class="navbar">
        <a href="/dashboard" class="navbar-brand">
            <div class="brand-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </div>
            <div class="flex items-center gap-2">
                <span class="brand-title">Telegram Relay</span>
                <span class="brand-badge">Enterprise</span>
            </div>
        </a>

        <div class="navbar-center">
            <div id="nav-status" hx-get="/api/mtproto/status" hx-trigger="load, every 15s">
                <span class="badge badge-neutral">Loading status...</span>
            </div>
        </div>

        <div class="navbar-end">
            <div class="user-chip">
                <div class="user-avatar">A</div>
                <span>Administrator</span>
            </div>
            <a href="/logout" class="btn btn-nav-logout btn-sm">
                <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                Sign out
            </a>
        </div>
    </header>
    {% endif %}

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Custom Reusable Confirmation Modal (Strict compliance with modal rules) -->
    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-dialog">
            <div class="modal-header">
                <div class="modal-icon-danger">
                    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                </div>
                <h3 class="modal-title" id="confirm-title">Confirm Action</h3>
            </div>
            <div class="modal-body" id="confirm-body">
                Are you sure you want to proceed with this action?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" onclick="closeConfirmModal()">Cancel</button>
                <button type="button" class="btn btn-error" id="confirm-submit-btn">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        function showConfirmModal(title, message, actionFn) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-body').innerText = message;
            const submitBtn = document.getElementById('confirm-submit-btn');
            submitBtn.onclick = function() {
                closeConfirmModal();
                if (actionFn) actionFn();
            };
            document.getElementById('confirm-modal').classList.add('active');
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal').classList.remove('active');
        }

        document.getElementById('confirm-modal').addEventListener('click', function(e) {
            if (e.target === this) closeConfirmModal();
        });
    </script>
</body>
</html>
