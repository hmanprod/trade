{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<style>
    .login-wrapper {
        min-height: calc(100vh - 160px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
    }

    .login-card {
        width: 100%;
        max-width: 420px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 40px 36px;
        box-shadow: var(--shadow-lg);
    }

    .login-brand-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin-bottom: 28px;
    }

    .login-icon-box {
        width: 52px;
        height: 52px;
        background: linear-gradient(135deg, #009252 0%, #059669 100%);
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #FFFFFF;
        margin-bottom: 16px;
        box-shadow: 0 8px 20px rgba(0, 146, 82, 0.3);
    }

    .login-heading {
        font-size: 22px;
        font-weight: 700;
        color: var(--navy-dark);
        letter-spacing: -0.02em;
        margin-bottom: 6px;
    }

    .login-subtitle {
        font-size: 14px;
        color: var(--text-secondary);
    }

    .login-form {
        display: flex;
        flex-direction: column;
        gap: 18px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .form-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--navy-dark);
    }

    .login-submit {
        margin-top: 8px;
        width: 100%;
        padding: 12px;
        font-size: 14px;
    }

    .security-notice {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 12px;
        color: var(--text-muted);
    }
</style>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-brand-header">
            <div class="login-icon-box">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </div>
            <div class="login-heading">Telegram Relay</div>
            <div class="login-subtitle">Sign in to your administration dashboard</div>
        </div>

        {% if error %}
        <div class="alert alert-error mb-4">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Invalid username or password credentials.
        </div>
        {% endif %}

        <form action="/login" method="POST" class="login-form" autocomplete="off">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username"
                       class="input" placeholder="Admin username"
                       autocomplete="off" required autofocus>
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password"
                       class="input" placeholder="••••••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary login-submit">
                Sign in to Console
            </button>
        </form>

        <div class="security-notice">
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            Protected Admin Workspace & MTProto Relay
        </div>
    </div>
</div>
{% endblock %}
