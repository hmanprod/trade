{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}

<!-- Connection -->
<div class="card bg-base-200 shadow-sm mb-6">
    <div class="card-body">
        <h2 class="card-title">Telegram Connection</h2>
        <div id="mtproto-status" hx-get="/api/mtproto/status"
             hx-trigger="load, every 30s" class="mb-2">
            <span class="loading loading-spinner loading-sm"></span>
        </div>
        <div id="mtproto-form" class="mt-2">
            <form hx-post="/api/mtproto/send-code" hx-target="#mtproto-form"
                  class="flex gap-2 items-end">
                <fieldset class="fieldset flex-1">
                    <label class="fieldset-label">Phone number</label>
                    <input type="text" name="phone" class="input w-full"
                           placeholder="+33612345678" required>
                </fieldset>
                <button class="btn btn-primary">Connect</button>
            </form>
        </div>
    </div>
</div>

<!-- Groups -->
<div class="card bg-base-200 shadow-sm mb-6">
    <div class="card-body">
        <h2 class="card-title">Groups</h2>
        <div class="flex gap-2 mb-2">
            <button hx-get="/api/groups" hx-target="#groups-list"
                    class="btn btn-outline btn-sm">Refresh</button>
        </div>
        <div id="groups-list" class="overflow-x-auto text-sm">Press Refresh</div>
    </div>
</div>

<!-- Filters -->
<div class="card bg-base-200 shadow-sm mb-6">
    <div class="card-body">
        <h2 class="card-title">Filters</h2>
        <form hx-post="/api/config/filters" hx-target="#filters-msg">
            <fieldset class="fieldset">
                <label class="fieldset-label">Keywords (comma separated)</label>
                <input type="text" name="keywords" class="input w-full"
                       placeholder="bitcoin, ethereum, defi" id="keywords-input">
            </fieldset>
            <button class="btn btn-primary btn-sm mt-2">Save</button>
        </form>
        <div id="filters-msg" class="mt-2 text-xs"></div>
    </div>
</div>

<!-- Relay -->
<div class="card bg-base-200 shadow-sm mb-6">
    <div class="card-body">
        <h2 class="card-title">Relay</h2>
        <div id="relay-status" hx-get="/api/relay/status"
             hx-trigger="load, every 10s" class="mb-4"></div>
        <div class="flex gap-2">
            <button hx-post="/api/relay/start" hx-target="#relay-status"
                    class="btn btn-success btn-sm">Start</button>
            <button hx-post="/api/relay/stop" hx-target="#relay-status"
                    class="btn btn-error btn-sm">Stop</button>
        </div>
    </div>
</div>

<script>
    // Load saved keywords on page load
    htmx.on('htmx:afterSwap', function(evt) {
        if (evt.detail.target.id === 'relay-status') {
            fetch('/api/config/filters').then(r => r.json()).then(d => {
                if (d.keywords) document.getElementById('keywords-input').value = d.keywords;
            });
        }
    });
</script>

{% endblock %}
