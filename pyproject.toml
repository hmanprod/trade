[project]
name = "trade"
version = "0.1.0"
description = "Telegram message relay — scrape source groups and forward to destination"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "telethon>=1.38.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "itsdangerous>=2.2.0",
    "cryptography>=44.0.0",
    "python-multipart>=0.0.18",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = []
